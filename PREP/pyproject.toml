pandas = "^2.2.3"
ipyparallel = "^8.8.0"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
optuna = "^4.0.0"
jupyter = "^1.1.1"
xgboost = "^2.1.2"
numpy = "^2.1.3"
sktime = "^0.34.0"
neurokit2 = "^0.2.10"
mne = "^1.9.0"
PyWavelets = "^1.8.0"
pytest = "^8.3.4"
pyprep = "^0.4.3"
ipykernel = "^6.29.5"
biosppy = "^2.2.2"
cvxopt = "^1.3.2"
dotmap = "^1.3.30"
