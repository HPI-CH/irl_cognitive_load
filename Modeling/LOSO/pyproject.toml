[tool.poetry]
name = "automatic-feature-generation-with-tensorflow"
version = "0.1.0"
description = "Automatic feature generation using deep learning"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pandas = "^2.2.3"
ipyparallel = "^8.8.0"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
optuna = "^4.0.0"
jupyter = "^1.1.1"
keras = "^3.6.0"
ipykernel = "^6.29.5"
scikit-learn = "^1.5.2"
torch = "^2.4.1"
torch-scatter = "^2.1.2"
torch-sparse = "^0.6.18"
sparselinear = "^0.0.5"
torchmetrics = "^1.5.1"
xgboost = "^2.1.2"
numpy = "^2.1.3"
sktime = "^0.34.0"


[poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
