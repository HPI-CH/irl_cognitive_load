[tool.poetry]
name = "kogl_iel"
version = "0.1.0"
description = "Automatic feature generation using deep learning"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pandas = "^2.2.3"
ipyparallel = "^8.8.0"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
optuna = "^4.0.0"
keras = "^3.6.0"
ipykernel = "^6.29.5"
scikit-learn = "^1.5.2"
torchmetrics = "^1.5.1"
xgboost = "^2.1.2"
numpy = "^2.1.3"
sktime = "^0.34.0"
optuna-integration = {extras = ["xgboost"], version = "^4.2.1"}


[tool.poetry.dev-dependencies]
ipykernel = "^6.29.5"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

